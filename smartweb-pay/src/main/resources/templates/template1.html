<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <style>
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th { background-color: #f5f5f5; padding: 8px; text-align: left; }
        td { border: 1px solid #ddd; padding: 8px; }
        body {
            font-family: SimSun,serif;
            font-size: 12px;
        }
    </style>
</head>
<body>
<h2>缴费收据</h2>
收款单位：<span th:text="${data.BUSI_NAME}"></span>
订单号：<span th:text="${data.REQ_SEQ}"></span>
学生姓名：<span th:text="${data.NAME}"></span>
学号：<span th:text="${data.STU_ID}"></span>
手机号：<span th:text="${data.PHONE_NO}"></span>
生成日期：<span th:text="${data.CREATE_DATE}"></span>
<table>
    <thead>
    <tr>
        <th>缴费项目</th>
        <th>缴费周期</th>
        <th>缴费金额（元）</th>
        <th>缴费时间</th>
        <th>缴费状态</th>
    </tr>
    </thead>
    <tbody>
    <!-- 循环生成表格行 -->
    <tr th:each="item : ${data.items}">
        <td th:text="${item.PROJ_NAME}">Product Name</td>
        <td th:text="${item.OWE_MONTH}">10</td>
        <td th:text="${item.PRCTL_AMT}">0.00</td>
        <td th:text="${item.PAY_TIME}">1000.00</td>
        <td th:text="${item.STAT}">1000.00</td>
    </tr>


    </tbody>
</table>
</body>
</html>
