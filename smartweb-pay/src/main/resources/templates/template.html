<div>
	<h2 style="margin: 0 auto;width:350px">缴费收据</h2>
	<div class="info-group clearfix">
		<div class="busi-name">
			收款单位：<span th:text="${data.BUSI_NAME}"></span>
		</div>
		<div class="order-no">
			订单号：<span th:text="${data.REQ_SEQ}"></span>
		</div>
	</div>
	<p class="student-info">
		学生姓名：<span th:text="${data.NAME}"></span>
		学号：<span th:text="${data.STU_ID}"></span>
		手机号：<span th:text="${data.PHONE_NO}"></span>
		生成日期：<span th:text="${data.CREATE_DATE}"></span>
	</p>
	<table>
		<thead>
		<tr>
			<th>缴费项目</th>
			<th>缴费周期</th>
			<th>缴费金额（元）</th>
			<th>缴费时间</th>
			<th>缴费状态</th>
		</tr>
		</thead>
		<tbody>
		<!-- 循环生成表格行 -->
		<tr th:each="item : ${data.SUB_LIST}">
			<td th:text="${item.PROJ_NAME}">Product Name</td>
			<td th:text="${item.OWE_MONTH}">10</td>
			<td th:text="${item.TOT_AMT}">0.00</td>
			<td th:text="${item.PAY_TIME}">1000.00</td>
			<td>已缴费</td>
			<!--<td th:text="${item.STAT}">1000.00</td>-->
		</tr>


		</tbody>
	</table>
</div>
