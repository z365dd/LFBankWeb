#===================================#
#===== SIT\u73AF\u5883Database sttings =====#
#===================================#
#pool settings
#\u521D\u59CB\u5316\u8FDE\u63A5\u6570
jdbc.pool.init=1
#\u6700\u5C0F\u8FDE\u63A5\u6570
jdbc.pool.minIdle=3
#\u6700\u5927\u8FDE\u63A5\u6570
jdbc.pool.maxActive=20
#\u83B7\u53D6\u8FDE\u63A5\u7B49\u5F85\u8D85\u65F6\u7684\u65F6\u95F4(ms)
jdbc.pool.maxWait=180000
#\u914D\u7F6E\u95F4\u9694\u591A\u4E45\u624D\u8FDB\u884C\u4E00\u6B21\u68C0\u6D4B\uFF0C\u68C0\u6D4B\u9700\u8981\u5173\u95ED\u7684\u7A7A\u95F2\u8FDE\u63A5\uFF0C\u5355\u4F4D\u662F\u6BEB\u79D2
jdbc.pool.timeBetweenEvictionRunsMillis=60000
#\u914D\u7F6E\u4E00\u4E2A\u8FDE\u63A5\u5728\u6C60\u4E2D\u6700\u5C0F\u751F\u5B58\u7684\u65F6\u95F4\uFF0C\u5355\u4F4D\u662F\u6BEB\u79D2
jdbc.pool.minEvictableIdleTimeMillis=300000
#\u6307\u660E\u8FDE\u63A5\u662F\u5426\u88AB\u7A7A\u95F2\u8FDE\u63A5\u56DE\u6536\u5668(\u5982\u679C\u6709)\u8FDB\u884C\u68C0\u9A8C.\u5982\u679C\u68C0\u6D4B\u5931\u8D25,\u5219\u8FDE\u63A5\u5C06\u88AB\u4ECE\u6C60\u4E2D\u53BB\u9664(true/false)
jdbc.pool.testWhileIdle=true
#\u6307\u660E\u662F\u5426\u5728\u4ECE\u6C60\u4E2D\u53D6\u51FA\u8FDE\u63A5\u524D\u8FDB\u884C\u68C0\u9A8C,\u5982\u679C\u68C0\u9A8C\u5931\u8D25,\u5219\u4ECE\u6C60\u4E2D\u53BB\u9664\u8FDE\u63A5\u5E76\u5C1D\u8BD5\u53D6\u51FA\u53E6\u4E00\u4E2A(true/false)
jdbc.pool.testOnBorrow=true
#\u5426\u5728\u5F52\u8FD8\u5230\u6C60\u4E2D\u524D\u8FDB\u884C\u68C0\u9A8C(true/false)
jdbc.pool.testOnReturn=true
#\u662F\u5426\u68C0\u6D4B\u5185\u5B58\u6CC4\u9732\u7684\u8FDE\u63A5\uFF0C(true/false)
jdbc.pool.removeAbandoned=true
#\u8C03\u7528dataSource.getConnection\u5F00\u59CB\u5230\u4E22\u5F03\u68C0\u6D4B\u5230\u6CC4\u9732\u8FDE\u63A5\u7684\u65F6\u95F4\uFF08seconds\uFF09
jdbc.pool.removeAbandonedTimeout=300
#\u5982\u679C\u60F3\u7528log\u8BB0\u5F55\u4E22\u5F03\u7684\u8FDE\u63A5\uFF0C\u53EF\u4EE5\u8BBE\u7F6E\u4E3Atrue\u3002\u5F53\u8BBE\u7F6E\u4E3Atrue\u65F6\uFF0C\u8C03\u7528dataSource.getConnection \u65F6\u4F1A\u8BB0\u5F55\u4E00\u4E2A\u5806\u6808\u8FFD\u8E2A\uFF0C\u5E76\u4E14\u88AB\u6253\u5370\u51FA\u6765\u5F53\u8FDE\u63A5\u6CA1\u6709\u8FD4\u56DE\u7684\u65F6\u5019
jdbc.pool.logAbandoned=true



